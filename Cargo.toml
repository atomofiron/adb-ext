[package]
name = "adb-ext"
version = "0.7.0"
edition = "2021"

[dependencies]
nix = { version = "0.31", features = ["user", "signal"] }
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
chrono = "0.4"
dirs = "6.0"
which = "8.0"
itertools = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_yaml = "0.9"
regex = "1.13"
shell-words = "1.1"
rustyline = "18.0"
termcolor = "1.4"
ureq = "3.1"
indicatif = "0.18"

[target.x86_64-pc-windows-gnu.dependencies]
windows-sys = "0.61"

[target.x86_64-unknown-linux-musl.dependencies]
rusb = "0.9.4"
openssl-sys = { version = "0.9.98", features = ["vendored"] } # for the cross-compilation, remove and check cargo tree --target x86_64-unknown-linux-gnu -e normal

